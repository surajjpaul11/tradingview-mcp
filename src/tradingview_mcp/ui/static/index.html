<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Visualizer</title>
    <link rel="stylesheet" href="/static/style.css?v=14">
    <!-- Google Fonts for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header & Controls -->
        <header class="topbar glass-panel">
            <div class="header-left">
                <div class="brand">
                    <div class="logo"></div>
                    <h1>Trade Visualizer</h1>
                    <a href="/opportunities" style="margin-left: 1rem; color: #80baff; font-size: .9rem;">Opportunity research →</a>
                </div>

                <div class="brand-divider"></div>

                <div class="filter-group ticker-filter-group">
                    <label for="ticker-select">Ticker</label>
                    <div class="custom-select">
                        <select id="ticker-select">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="controls">
                <div class="filter-group">
                    <label for="strategy-select">Strategy</label>
                    <div class="custom-select">
                        <select id="strategy-select">
                            <option value="sloped_lines" selected>Slope Lines Strategy</option>
                            <option value="all">All Strategies</option>
                        </select>
                    </div>
                </div>

                <div class="filter-group" id="best-params-badge-group" style="display: none;">
                    <span id="best-params-badge" class="best-params-badge" title="Optimal parameters loaded from config">
                        <span class="star-icon">★</span> Best Params
                    </span>
                </div>

                <div class="filter-group" id="channel-mult-group" style="display: none;">
                    <label for="channel-mult-select">Channel Width (Mult)</label>
                    <div class="custom-select">
                        <select id="channel-mult-select">
                            <option value="2.0">2.0x (Wide · 95% CI)</option>
                            <option value="1.8">1.8x</option>
                            <option value="1.7" selected>1.7x (Optimal · Balanced)</option>
                            <option value="1.6">1.6x (Tight · Responsive)</option>
                            <option value="1.5">1.5x (Ultra-Tight)</option>
                            <option value="1.4">1.4x</option>
                        </select>
                    </div>
                </div>

                <div class="filter-group" id="channel-lookback-group" style="display: none;">
                    <label for="channel-lookback-select">Lookback (Bars)</label>
                    <div class="custom-select">
                        <select id="channel-lookback-select">
                            <option value="30">30 bars (~6 wk)</option>
                            <option value="42">42 bars (~2 mo)</option>
                            <option value="50" selected>50 bars (Optimal · ~2.5 mo)</option>
                            <option value="63">63 bars (~3 mo)</option>
                            <option value="84">84 bars (~4 mo)</option>
                        </select>
                    </div>
                </div>

                <div class="filter-group" id="channel-stoploss-group" style="display: none;">
                    <label class="checkbox-container" for="channel-stoploss-checkbox">
                        <input type="checkbox" id="channel-stoploss-checkbox">
                        <span class="checkbox-text">Stop Loss</span>
                    </label>
                </div>

                <div class="filter-group" id="channel-midline-group" style="display: none;">
                    <label class="checkbox-container" for="channel-midline-checkbox">
                        <input type="checkbox" id="channel-midline-checkbox">
                        <span class="checkbox-text">Midline Cross</span>
                    </label>
                </div>

                <div class="filter-group" id="channel-lower-reclaim-group" style="display: none;">
                    <label class="checkbox-container" for="channel-lower-reclaim-checkbox">
                        <input type="checkbox" id="channel-lower-reclaim-checkbox">
                        <span class="checkbox-text">Lower Reclaim</span>
                    </label>
                </div>

                <div class="filter-group" id="channel-curl-group" style="display: none;">
                    <label for="channel-curl-select">Channel Curl</label>
                    <div class="custom-select">
                        <select id="channel-curl-select">
                            <option value="both" selected>Both (curl buy and curl sell)</option>
                            <option value="buy">Curl buy</option>
                            <option value="sell">Curl sell</option>
                            <option value="none">None</option>
                        </select>
                    </div>
                </div>

                <div class="filter-group" id="sloped-full-candle-group" style="display: flex;">
                    <label class="checkbox-container" for="sloped-full-candle-checkbox">
                        <input type="checkbox" id="sloped-full-candle-checkbox">
                        <span class="checkbox-text">Full Candle</span>
                    </label>
                </div>

                <div class="filter-group" id="sloped-wick-group" style="display: flex;">
                    <label class="checkbox-container" for="sloped-wick-checkbox">
                        <input type="checkbox" id="sloped-wick-checkbox">
                        <span class="checkbox-text">Wick</span>
                    </label>
                </div>

                <div class="filter-group" id="sloped-confirm-candles-group" style="display: flex;">
                    <label for="sloped-confirm-candles-select">Confirmation Candles</label>
                    <div class="custom-select">
                        <select id="sloped-confirm-candles-select">
                            <option value="0" selected>0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </div>
                </div>

                <div class="filter-group" id="sloped-inverse-color-group" style="display: flex;">
                    <label class="checkbox-container" for="sloped-inverse-color-checkbox">
                        <input type="checkbox" id="sloped-inverse-color-checkbox">
                        <span class="checkbox-text">Inverse Color Trigger</span>
                    </label>
                </div>

                <div class="filter-group" id="sloped-line-angle-group" style="display: flex;">
                    <label for="sloped-line-angle-select">Line Angle</label>
                    <div class="custom-select">
                        <select id="sloped-line-angle-select">
                            <option value="0">0%</option>
                            <option value="2">2%</option>
                            <option value="3" selected>3%</option>
                            <option value="5">5%</option>
                            <option value="8">8%</option>
                        </select>
                    </div>
                </div>

                <div class="filter-group" id="sloped-stop-loss-group" style="display: flex;">
                    <label for="sloped-stop-loss-select">Stop Loss</label>
                    <div class="custom-select">
                        <select id="sloped-stop-loss-select">
                            <option value="none">None</option>
                            <option value="exit_peak_reclaim" selected>Exit Peak Reclaim</option>
                            <option value="barrier_trap_reentry">Barrier Trap Reentry</option>
                            <option value="atr_stop_buffer">ATR Stop Buffer</option>
                        </select>
                    </div>
                </div>

                <div class="filter-group" id="sloped-anchor-bars-group" style="display: flex;">
                    <label for="sloped-anchor-bars-select">Anchor Bars</label>
                    <div class="custom-select">
                        <select id="sloped-anchor-bars-select" title="Minimum bar distance between anchors (min_anchor_bars)">
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2" selected>2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dynamic Statistics -->
        <div class="stats-row">
            <div class="stat-card glass-panel">
                <span class="stat-label">Total P&L</span>
                <span class="stat-value" id="pnl-val">--</span>
            </div>
            <div class="stat-card glass-panel">
                <span class="stat-label">Total P&L (%)</span>
                <span class="stat-value" id="pnl-pct-val">--</span>
            </div>
            <div class="stat-card glass-panel">
                <span class="stat-label">Buy & Hold (%)</span>
                <span class="stat-value" id="bnh-val">--</span>
            </div>
            <div class="stat-card glass-panel">
                <span class="stat-label">Win Rate</span>
                <span class="stat-value" id="winrate-val">--</span>
            </div>
            <div class="stat-card glass-panel">
                <span class="stat-label">Total Executions</span>
                <span class="stat-value" id="total-trades-val">--</span>
            </div>
        </div>

        <!-- Chart Area with Tab Sidebar -->
        <div class="chart-area-container">
            <!-- Vertical Tab Sidebar -->
            <div class="tab-sidebar glass-panel">
                <button class="tab-btn active" data-tab="regular" id="tab-regular">
                    <span class="tab-icon">📊</span>
                    <span class="tab-label">Regular</span>
                </button>
                <button class="tab-btn" data-tab="advanced" id="tab-advanced">
                    <span class="tab-icon">⚡</span>
                    <span class="tab-label">Advanced</span>
                </button>
            </div>

            <!-- Tab Content Panels -->
            <div class="tab-content">
                <!-- REGULAR TAB — existing chart (unchanged behavior) -->
                <div class="tab-panel active" id="panel-regular">
                    <div class="chart-wrapper glass-panel">
                        <div id="channel-legend" class="channel-legend" style="display: none;"></div>
                        <div id="tv-chart" class="chart-container"></div>
                        <!-- Loading overlay -->
                        <div id="loading" class="loading-overlay">
                            <div class="spinner"></div>
                            <p>Loading market data...</p>
                        </div>
                    </div>

                    <!-- Dual Resolution & Timeframe Bar -->
                    <div class="timeframe-bar glass-panel dual-controls-bar">
                        <!-- Candle Resolution Group -->
                        <div class="control-section">
                            <div class="timeframe-info">
                                <span class="timeframe-label">CANDLE RESOLUTION</span>
                                <span class="timeframe-hint" id="active-res-hint">Daily (1D)</span>
                            </div>
                            <div class="timeframe-buttons" id="resolution-btn-group">
                                <button class="tf-btn res-btn" data-res="30m" id="btn-res-30m">30m</button>
                                <button class="tf-btn res-btn" data-res="1h" id="btn-res-1h">1H</button>
                                <button class="tf-btn res-btn" data-res="4h" id="btn-res-4h">4H</button>
                                <button class="tf-btn res-btn" data-res="12h" id="btn-res-12h">12H</button>
                                <button class="tf-btn res-btn active" data-res="1d" id="btn-res-1d">1D</button>
                                <button class="tf-btn res-btn" data-res="5d" id="btn-res-5d">5D</button>
                            </div>
                        </div>

                        <div class="control-divider"></div>

                        <!-- Timeframe / Range Group -->
                        <div class="control-section">
                            <div class="timeframe-info">
                                <span class="timeframe-label">TIMEFRAME / RANGE</span>
                                <span class="timeframe-hint" id="active-range-hint">1-Year (1Y)</span>
                            </div>
                            <div class="timeframe-buttons" id="timeframe-btn-group">
                                <button class="tf-btn range-btn" data-range="3mo" id="btn-range-3mo">3M</button>
                                <button class="tf-btn range-btn active" data-range="1y" id="btn-range-1y">1Y</button>
                                <button class="tf-btn range-btn" data-range="5y" id="btn-range-5y">5Y</button>
                                <button class="tf-btn range-btn" data-range="max" id="btn-range-max">MAX</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ADVANCED TAB — multi-resolution chart -->
                <div class="tab-panel" id="panel-advanced">
                    <div class="chart-wrapper glass-panel">
                        <div id="adv-channel-legend" class="channel-legend" style="display: none;"></div>
                        <div id="adv-chart" class="chart-container"></div>
                        <!-- Loading overlay -->
                        <div id="adv-loading" class="loading-overlay">
                            <div class="spinner"></div>
                            <p>Loading market data...</p>
                        </div>
                    </div>

                    <!-- Advanced Timeframe Bar -->
                    <div class="timeframe-bar glass-panel">
                        <div class="timeframe-info">
                            <span class="timeframe-label">RESOLUTION</span>
                            <span class="timeframe-hint" id="adv-range-hint">1-Year · Daily Candles</span>
                        </div>
                        <div class="timeframe-buttons" id="adv-timeframe-btn-group">
                            <button class="tf-btn adv-tf-btn" data-adv-range="1d" id="adv-btn-1d">1D · 5min</button>
                            <button class="tf-btn adv-tf-btn" data-adv-range="5d" id="adv-btn-5d">5D · 15min</button>
                            <button class="tf-btn adv-tf-btn" data-adv-range="1mo" id="adv-btn-1mo">1M · Hourly</button>
                            <button class="tf-btn adv-tf-btn" data-adv-range="ytd" id="adv-btn-ytd">YTD · Daily</button>
                            <button class="tf-btn adv-tf-btn active" data-adv-range="1y" id="adv-btn-1y">1Y · Daily</button>
                            <button class="tf-btn adv-tf-btn" data-adv-range="5y" id="adv-btn-5y">5Y · Weekly</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TradingView Lightweight Charts (loaded locally with CDN fallback) -->
    <script src="/static/lightweight-charts.standalone.production.js"></script>
    <script>
        if (typeof LightweightCharts === 'undefined') {
            document.write('<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"><\/script>');
        }
    </script>
    <script src="/static/app.js?v=36"></script>
</body>
</html>
