<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backtest Chart</title>
<script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #131722;
    color: #d1d4dc;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
}
#header {
    padding: 12px 20px;
    background: #1e222d;
    border-bottom: 1px solid #2a2e39;
    flex-shrink: 0;
}
#header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #e0e3eb;
    margin-bottom: 8px;
}
#stats {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
}
.stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.stat-label {
    font-size: 10px;
    color: #787b86;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.stat-value {
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}
.stat-value.positive { color: #26a69a; }
.stat-value.negative { color: #ef5350; }
.stat-value.neutral  { color: #d1d4dc; }
#trade-log-toggle {
    position: absolute;
    top: 12px;
    right: 20px;
    background: #2a2e39;
    color: #d1d4dc;
    border: 1px solid #363a45;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    z-index: 10;
}
#trade-log-toggle:hover { background: #363a45; }
#chart-container {
    flex: 1;
    position: relative;
}
#trade-log-panel {
    display: none;
    position: absolute;
    top: 0;
    right: 0;
    width: 420px;
    height: 100%;
    background: #1e222d;
    border-left: 1px solid #2a2e39;
    z-index: 5;
    overflow-y: auto;
    padding: 12px;
    font-size: 12px;
}
#trade-log-panel.visible { display: block; }
#trade-log-panel h3 {
    color: #e0e3eb;
    margin-bottom: 8px;
    font-size: 13px;
}
.trade-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid #2a2e39;
    font-variant-numeric: tabular-nums;
}
.trade-row .side { width: 50px; font-weight: 600; }
.trade-row .side.long { color: #26a69a; }
.trade-row .side.short { color: #ef5350; }
.trade-row .dates { color: #787b86; flex: 1; margin: 0 8px; }
.trade-row .pnl { width: 70px; text-align: right; font-weight: 600; }
.trade-row .pnl.positive { color: #26a69a; }
.trade-row .pnl.negative { color: #ef5350; }
.trade-row .reason { width: 90px; text-align: right; color: #787b86; font-size: 11px; }
#legend {
    position: absolute;
    top: 12px;
    left: 12px;
    display: flex;
    gap: 16px;
    z-index: 5;
    font-size: 11px;
    background: rgba(19,23,34,0.85);
    padding: 6px 12px;
    border-radius: 4px;
}
.legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
}
.legend-swatch {
    width: 12px;
    height: 3px;
    border-radius: 1px;
}
</style>
</head>
<body>
<div id="header">
    <h1 id="title"></h1>
    <div id="stats"></div>
</div>
<button id="trade-log-toggle" onclick="toggleTradeLog()">Trade Log</button>
<div id="chart-container">
    <div id="trade-log-panel">
        <h3>Trade Log</h3>
        <div id="trade-log-body"></div>
    </div>
    <div id="legend"></div>
</div>

            lineWidth: overlay.lineWidth || 2,
            lineStyle: overlay.lineStyle || 0,
            lastValueVisible: false,
            priceLineVisible: false,
            crosshairMarkerVisible: false,
        });

        if (overlay.label) {
            legendHTML += '<div class="legend-item">' +
                '<div class="legend-swatch" style="background:' + overlay.color + '"></div>' +
                '<span>' + overlay.label + '</span></div>';
        }
    } else if (overlay.type === 'marker_points' && overlay.points && overlay.points.length > 0) {
        const ptSeries = chart.addLineSeries({
            color: 'rgba(0,0,0,0)',
            lineWidth: 0,
            lastValueVisible: false,
            priceLineVisible: false,
            crosshairMarkerVisible: false,
            pointMarkersVisible: false,
        });
        ptSeries.setData(overlay.points);

        // Draw circle markers using the series markers API
        const ptMarkers = overlay.points.map(p => ({
            time: p.time,
            position: 'inBar',
            color: overlay.color || '#FFFFFF',
            shape: 'circle',
            text: '',
            size: 1,
        }));
        ptSeries.setMarkers(ptMarkers);

        if (overlay.label) {
            legendHTML += '<div class="legend-item">' +
                '<div class="legend-swatch" style="background:' + (overlay.color || '#FFFFFF') +
                '; border-radius: 50%; width: 8px; height: 8px;"></div>' +
                '<span>' + overlay.label + '</span></div>';
        }
    }
});
