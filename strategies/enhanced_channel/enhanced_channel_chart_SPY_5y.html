<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backtest Chart</title>
<script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #131722;
    color: #d1d4dc;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
}
#header {
    padding: 12px 20px;
    background: #1e222d;
    border-bottom: 1px solid #2a2e39;
    flex-shrink: 0;
}
#header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #e0e3eb;
    margin-bottom: 8px;
}
#stats {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
}
.stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.stat-label {
    font-size: 10px;
    color: #787b86;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.stat-value {
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}
.stat-value.positive { color: #26a69a; }
.stat-value.negative { color: #ef5350; }
.stat-value.neutral  { color: #d1d4dc; }
#toolbar-buttons {
    position: absolute;
    top: 12px;
    right: 20px;
    display: flex;
    gap: 8px;
    z-index: 10;
}
.toolbar-btn {
    background: #2a2e39;
    color: #d1d4dc;
    border: 1px solid #363a45;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
}
.toolbar-btn:hover { background: #363a45; }
.toolbar-btn.active { background: #363a45; border-color: #d1d4dc; }
#vix-toggle { color: #FF9800; border-color: #FF9800; }
#vix-toggle:hover, #vix-toggle.active { background: rgba(255,152,0,0.15); border-color: #FF9800; }
#rsi-toggle { color: #E040FB; border-color: #E040FB; }
#rsi-toggle:hover, #rsi-toggle.active { background: rgba(224,64,251,0.15); border-color: #E040FB; }
#legend-toggle { color: #81C784; border-color: #81C784; }
#legend-toggle:hover, #legend-toggle.active { background: rgba(129,199,132,0.15); border-color: #81C784; }
#trade-log-toggle { color: #FFD54F; border-color: #FFD54F; }
#trade-log-toggle:hover, #trade-log-toggle.active { background: rgba(255,213,79,0.15); border-color: #FFD54F; }
#legend-panel {
    display: none;
    position: absolute;
    top: 0;
    right: 0;
    width: 560px;
    height: 100%;
    background: #1e222d;
    border-right: 1px solid #2a2e39;
    z-index: 5;
    overflow-y: auto;
    padding: 16px;
    font-size: 12px;
}
#legend-panel.visible { display: block; }
#legend-panel h3 {
    color: #e0e3eb;
    margin-bottom: 12px;
    font-size: 14px;
}
#legend-panel h4 {
    color: #e0e3eb;
    margin: 16px 0 8px;
    font-size: 12px;
    padding-bottom: 4px;
    border-bottom: 1px solid #2a2e39;
}
#legend-panel table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 8px;
    font-size: 11px;
}
#legend-panel th {
    text-align: left;
    padding: 5px 8px;
    background: #131722;
    color: #787b86;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-size: 10px;
    border-bottom: 1px solid #2a2e39;
}
#legend-panel td {
    padding: 5px 8px;
    border-bottom: 1px solid #1e222d;
    vertical-align: top;
    color: #9598a1;
}
#legend-panel tr:hover { background: rgba(42,46,57,0.4); }
.lp-marker {
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    white-space: nowrap;
    display: inline-block;
}
.lp-marker.buy { background: rgba(38,166,154,0.15); color: #26a69a; }
.lp-marker.sell { background: rgba(239,83,80,0.15); color: #ef5350; }
.lp-abbrev {
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    font-weight: 700;
    font-size: 11px;
    white-space: nowrap;
}
.lp-abbrev.entry { color: #26a69a; }
.lp-abbrev.exit { color: #ef5350; }
.lp-name { color: #d1d4dc; white-space: nowrap; }
.lp-desc { color: #9598a1; }
.lp-vtag-pill {
    display: inline-block;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 3px;
    margin: 1px 2px;
}
.lp-vtag-pill.entry { background: rgba(77,208,225,0.15); color: #4dd0e1; }
.lp-vtag-pill.exit { background: rgba(255,183,77,0.15); color: #ffb74d; }
.lp-vtag-plain { color: #787b86; font-size: 10px; }
.lp-vtype { color: #787b86; font-size: 10px; }
#chart-container {
    flex: 1;
    position: relative;
}
#trade-log-panel {
    display: none;
    position: absolute;
    top: 0;
    right: 0;
    width: 560px;
    height: 100%;
    background: #1e222d;
    border-left: 1px solid #2a2e39;
    z-index: 5;
    overflow-y: auto;
    padding: 12px;
    font-size: 12px;
}
#trade-log-panel.visible { display: block; }
#trade-log-panel h3 {
    color: #e0e3eb;
    margin-bottom: 8px;
    font-size: 13px;
}
.trade-row {
    padding: 6px 0;
    border-bottom: 1px solid #2a2e39;
    font-variant-numeric: tabular-nums;
}
.trade-row-main {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.trade-row .side { width: 50px; font-weight: 600; display: inline-block; }
.trade-row .side.long { color: #26a69a; }
.trade-row .side.short { color: #ef5350; }
.trade-row .entry-type { color: #d1d4dc; margin-left: 4px; font-size: 11px; }
.trade-row .dates { color: #787b86; flex: 1; margin: 0 8px; }
.trade-row .pnl { width: 70px; text-align: right; font-weight: 600; }
.trade-row .pnl.positive { color: #26a69a; }
.trade-row .pnl.negative { color: #ef5350; }
.trade-row .reason { width: 90px; text-align: right; color: #787b86; font-size: 11px; }
.trade-row-versions {
    font-size: 10px;
    color: #787b86;
    margin-top: 2px;
    padding-left: 54px;
}
.trade-row-versions .entry-ver { color: #4dd0e1; }
.trade-row-versions .exit-ver { color: #ffb74d; }
#legend {
    position: absolute;
    top: 12px;
    left: 12px;
    display: flex;
    gap: 16px;
    z-index: 5;
    font-size: 11px;
    background: rgba(19,23,34,0.85);
    padding: 6px 12px;
    border-radius: 4px;
}
.legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
}
.legend-swatch {
    width: 12px;
    height: 3px;
    border-radius: 1px;
}
#version-legend {
    position: absolute;
    bottom: 12px;
    left: 12px;
    z-index: 6;
    background: rgba(30,34,45,0.95);
    border: 1px solid #363a45;
    border-radius: 6px;
    font-size: 11px;
    max-width: 480px;
    overflow: hidden;
}
#version-legend-header {
    padding: 6px 12px;
    cursor: pointer;
    color: #e0e3eb;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    user-select: none;
}
#version-legend-header:hover { background: rgba(54,58,69,0.5); }
#version-legend-body {
    display: none;
    padding: 4px 12px 8px;
}
#version-legend-body.open { display: block; }
.ver-row {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    padding: 2px 8px 2px 0;
    min-width: 200px;
}
.ver-tag { color: #4dd0e1; font-weight: 600; min-width: 28px; }
.ver-label { color: #d1d4dc; }
.ver-desc { color: #787b86; font-size: 10px; }
</style>
</head>
<body>
<div id="header">
    <h1 id="title"></h1>
    <div id="stats"></div>
</div>
<div id="toolbar-buttons">
    <button id="vix-toggle" class="toolbar-btn" onclick="toggleVix()" style="display:none">VIX</button>
    <button id="rsi-toggle" class="toolbar-btn" onclick="toggleRsi()" style="display:none">RSI</button>
    <button id="legend-toggle" class="toolbar-btn" onclick="toggleLegendPanel()">Legend</button>
    <button id="trade-log-toggle" class="toolbar-btn" onclick="toggleTradeLog()">Trade Log</button>
</div>
<div id="chart-container">
    <div id="legend-panel">
        <h3>Chart Legend Reference</h3>
        <div id="legend-panel-body"></div>
    </div>
    <div id="trade-log-panel">
        <h3>Trade Log</h3>
        <div id="trade-log-body"></div>
    </div>
    <div id="legend"></div>
    <div id="version-legend">
        <div id="version-legend-header" onclick="toggleVersionLegend()">
            <span id="ver-arrow">\u25B6</span> Strategy Versions
        </div>
        <div id="version-legend-body"></div>
    </div>
</div>

// --- Time conversion ---
function parseTime(dateStr) {
    if (dateStr.includes(' ')) {
        // Intraday: "2024-01-15 14:00" -> Unix timestamp (UTC)
        return Math.floor(new Date(dateStr.replace(' ', 'T') + ':00Z').getTime() / 1000);
    }
    return dateStr; // Daily: "2024-01-15" works directly
}

// Convert all time fields
CANDLES.forEach(c => c.time = parseTime(c.time));
MARKERS.forEach(m => m.time = parseTime(m.time));
OVERLAYS.forEach(o => {
    if (o.points) o.points.forEach(p => p.time = parseTime(p.time));
});
VOLUME.forEach(v => v.time = parseTime(v.time));
VIX_DATA.forEach(v => v.time = parseTime(v.time));

    if (val > 0) return 'positive';
    if (val < 0) return 'negative';

// --- Side Panel Helpers (mutually exclusive — only one open at a time) ---
function getOpenPanelWidth() {
    const lp = document.getElementById('legend-panel');
    const tp = document.getElementById('trade-log-panel');
    if (lp.classList.contains('visible') || tp.classList.contains('visible')) return 560;
    return 0;
}
function resizeChart() {
    chart.applyOptions({ width: container.clientWidth - getOpenPanelWidth(), height: container.clientHeight });
}

// --- Legend Panel ---
function toggleLegendPanel() {
    const legend = document.getElementById('legend-panel');
    const tradeLog = document.getElementById('trade-log-panel');
    if (legend.classList.contains('visible')) {
        legend.classList.remove('visible');
    } else {
        tradeLog.classList.remove('visible');
        legend.classList.add('visible');
    }
    resizeChart();
}

// --- Trade Log Panel ---

    const legend = document.getElementById('legend-panel');

        tradeLog.classList.remove('visible');
    } else {
        legend.classList.remove('visible');
        tradeLog.classList.add('visible');
    }
    resizeChart();
}

// --- Version Legend ---
function toggleVersionLegend() {
    const body = document.getElementById('version-legend-body');
    const arrow = document.getElementById('ver-arrow');
    body.classList.toggle('open');
    arrow.textContent = body.classList.contains('open') ? '\u25BC' : '\u25B6';
}

(function buildVersionLegend() {
    const body = document.getElementById('version-legend-body');
    const tags = Object.keys(VERSIONS).sort((a, b) => {
        const na = parseInt(a.replace('v',''), 10);
        const nb = parseInt(b.replace('v',''), 10);
        return na - nb;
    });
    if (tags.length === 0) {
        document.getElementById('version-legend').style.display = 'none';
        return;
    }
    document.getElementById('version-legend-header').innerHTML =
        '<span id="ver-arrow">\u25B6</span> Strategy Versions (v' +
        tags[tags.length - 1].replace('v','') + ')';
    let html = '';
    tags.forEach(tag => {
        const v = VERSIONS[tag];
        html += '<div class="ver-row">' +
            '<span class="ver-tag">' + tag + '</span>' +
            '<span class="ver-label">' + v.label + '</span>' +
            '<span class="ver-desc"> \u2014 ' + v.description + '</span>' +
            '</div>';
    });
    body.innerHTML = html;
})();

        'rsi_momentum_fade':     { abbrev: 'RSI-FADE',   name: 'RSI Momentum Fade',        desc: 'RSI dropped below 40 (long) or rose above 60 (short) \u2014 momentum that triggered entry is fading.', color: '#FF9800' },
        // Scalping exits
        'stop_loss':             { abbrev: 'SL',          name: 'Stop Loss',                desc: 'Price hit ATR-based stop loss level (1.5x ATR from entry).', color: '#ef5350' },
        'take_profit':           { abbrev: 'TP',          name: 'Take Profit',              desc: 'Price reached ATR-based take profit target (2.5x ATR from entry).', color: '#4CAF50' },
        // Synthetic Long exits
        'call_profit_target':    { abbrev: 'CALL-TP',     name: 'Call Profit Target',       desc: 'Deep ITM call reached +50% gain \u2014 close to lock in profit.', color: '#4CAF50' },
        'call_stop_loss':        { abbrev: 'CALL-SL',     name: 'Call Stop Loss',           desc: 'Deep ITM call hit -40% loss \u2014 cut losses on the call leg.', color: '#ef5350' },
        'vix_normalized':        { abbrev: 'VIX-NORM',    name: 'VIX Normalized',           desc: 'VIX dropped below 20 (fear subsided) and call is profitable \u2014 exit into calm market.', color: '#00BCD4' },
        'max_hold':              { abbrev: 'MAX-HOLD',    name: 'Max Hold Time',            desc: 'Call held for 300 days without exit trigger \u2014 close before theta decay accelerates.', color: '#FFAB40' },
        'put_decay_profit':      { abbrev: 'PUT-DECAY',   name: 'Put Decay Profit',         desc: 'Sold put decayed to \u226410% of original premium \u2014 buy back cheap to close.', color: '#4CAF50' },
        'put_assigned':          { abbrev: 'PUT-ASGN',    name: 'Put Assigned',             desc: 'Stock dropped below put strike \u2014 assigned, forced to buy shares at strike price.', color: '#ef5350' },
        'put_expiry':            { abbrev: 'PUT-EXP',     name: 'Put Expiry',               desc: 'Put expired worthless (OTM at expiration) \u2014 full premium kept as profit.', color: '#66BB6A' },
        // News Volatility exits
        'profit_target':         { abbrev: 'TP',           name: 'Profit Target',            desc: 'Position reached +20% gain \u2014 lock in geopolitical premium profit.', color: '#4CAF50' },
        'event_fading':          { abbrev: 'FADE',         name: 'Event Fading',             desc: 'VIX dropped below 18 and oil retraced 50% of spike \u2014 geopolitical fear subsiding.', color: '#00BCD4' },
    };

    // Find which entry/exit types actually appear in the trade log
    const usedEntries = new Set();
    const usedExits = new Set();
    TRADE_LOG.forEach(t => {
        if (t.entry_reason) usedEntries.add(t.entry_reason);
        if (t.exit_reason) usedExits.add(t.exit_reason);
    });

    // Helper: convert hex color to rgba for background tint
    function hexToRgba(hex, alpha) {
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }

    // Build entry table (only showing types that appear in this chart's trades)
    let html = '<h4>Entry Markers</h4>' +
        '<table><tr><th>Marker</th><th>Abbrev</th><th>Name</th><th>Description</th></tr>';
    usedEntries.forEach(key => {
        const info = ENTRY_REGISTRY[key];
        if (!info) return;
        const prefix = info.side === 'long' ? 'BUY' : 'SHORT';
        const c = info.color;
        html += '<tr>' +
            '<td><span class="lp-marker" style="background:' + hexToRgba(c, 0.15) + ';color:' + c + '">' + prefix + ' ' + info.abbrev + '</span></td>' +
            '<td><span class="lp-abbrev" style="color:' + c + '">' + info.abbrev + '</span></td>' +
            '<td class="lp-name">' + info.name + '</td>' +
            '<td class="lp-desc">' + info.desc + '</td></tr>';
    });
    html += '</table>';

    // Build exit table
    html += '<h4>Exit Markers</h4>' +
        '<table><tr><th>Marker</th><th>Abbrev</th><th>Name</th><th>Description</th></tr>';
    usedExits.forEach(key => {
        const info = EXIT_REGISTRY[key];
        if (!info) return;
        const c = info.color;
        html += '<tr>' +
            '<td><span class="lp-marker" style="background:' + hexToRgba(c, 0.15) + ';color:' + c + '">EXIT ' + info.abbrev + '</span></td>' +
            '<td><span class="lp-abbrev" style="color:' + c + '">' + info.abbrev + '</span></td>' +
            '<td class="lp-name">' + info.name + '</td>' +
            '<td class="lp-desc">' + info.desc + '</td></tr>';
    });
    html += '</table>';

    // Version tags (if any)
    const tags = Object.keys(VERSIONS).sort((a, b) => parseInt(a.replace('v',''),10) - parseInt(b.replace('v',''),10));
    if (tags.length > 0) {
        html += '<h4>Strategy Version Tags</h4>' +
            '<table><tr><th>Tag</th><th>Label</th><th>Type</th><th>Description</th></tr>';
        tags.forEach(tag => {
            const v = VERSIONS[tag];
            const typeCls = (v.type === 'exit_type') ? 'exit' : 'entry';
            html += '<tr>' +
                '<td><span class="lp-vtag-pill ' + typeCls + '">' + tag + '</span></td>' +
                '<td class="lp-name">' + v.label + '</td>' +
                '<td class="lp-vtype">' + v.type.replace(/_/g,' ') + '</td>' +
                '<td class="lp-desc">' + v.description + '</td></tr>';
        });
        html += '</table>';
    }
    body.innerHTML = html;
})();

// --- Fit content ---
chart.timeScale().fitContent();

// --- Resize ---
const ro = new ResizeObserver(() => {
    resizeChart();
});
ro.observe(container);
</script>
</body>
</html>
